name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: findit
          POSTGRES_USER: findit
          POSTGRES_PASSWORD: findit_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findit -d findit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://findit:findit_test_password@localhost:5432/findit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade fastapi pillow httpx pytest python-multipart sqlalchemy "psycopg[binary]" pgvector email-validator "pwdlib[argon2]" PyJWT email-validator "pwdlib[argon2]" PyJWT

      - name: Run backend tests
        run: python -m pytest -q tests/
