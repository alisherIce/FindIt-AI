apiVersion: apps/v1
kind: Deployment
metadata:
  name: findit-web
  namespace: findit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: findit-web
  template:
    metadata:
      labels:
        app: findit-web
    spec:
      containers:
        - name: web
          image: ghcr.io/alisherice/findit-ai-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: findit-web
  namespace: findit
spec:
  selector:
    app: findit-web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
